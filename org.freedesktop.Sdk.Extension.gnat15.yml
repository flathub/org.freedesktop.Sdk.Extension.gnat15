id: org.freedesktop.Sdk.Extension.gnat15
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: gnat
    buildsystem: simple
    build-commands:
      - cp -R * "${FLATPAK_DEST}"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.3.0-1/gnat-aarch64-linux-15.3.0-1.tar.gz
        sha256: 322175876bf67b11d91b5cb8dea14da24b2f89f13292887222cf7f47a57f1db7
      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnat-15.3.0-1/gnat-x86_64-linux-15.3.0-1.tar.gz
        sha256: a6af58cbe96b8ed92b9d9929f89547c1be2ce96b86bb86422026074094429001

  - name: gnatprove
    buildsystem: simple
    build-commands:
      - cp -R * "${FLATPAK_DEST}"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-15.1.0-1/gnatprove-aarch64-linux-15.1.0-1.tar.gz
        sha256: 5131b7ccf04bb2c4ed12bd3e65ad92889f48ff1fabab257c6fa8407f067db7de

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gnatprove-15.1.0-1/gnatprove-x86_64-linux-15.1.0-1.tar.gz
        sha256: aad9a73f600d3008f33141a6cd4c5314d4c210e8928edc172c23c76104ddf7b2

  - name: gprbuild
    buildsystem: simple
    build-commands:
      - cp -R * "${FLATPAK_DEST}"
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-26.0.0-1/gprbuild-aarch64-linux-26.0.0-1.tar.gz
        sha256: c125424447144944973d24de43a53b3e7008dbda306e0d540db07e635dea24e4

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/GNAT-FSF-builds/releases/download/gprbuild-26.0.0-1/gprbuild-x86_64-linux-26.0.0-1.tar.gz
        sha256: e3f27f2515ec04d963f6badade6595993b1c091ba15d1919a7c75aad1b7ed49b

  - name: alire
    buildsystem: simple
    build-commands:
      - install -Dm755 -t "${FLATPAK_DEST}/bin" alr
    sources:
      - only-arches:
          - aarch64
        type: archive
        url: https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-aarch64-linux.zip
        sha256: d76c93ad3dc631826144e10bdabc6b3bf98783805bebfd5e4a0e852dd524d812

      - only-arches:
          - x86_64
        type: archive
        url: https://github.com/alire-project/alire/releases/download/v2.1.1/alr-2.1.1-bin-x86_64-linux.zip
        sha256: 09c66bcd8c35dd4b97b72c3d9b76e44caa6964a2db35aba069f396f00f1f64c7

  - name: enable-sh
    buildsystem: simple
    build-commands:
      - install -Dm755 -t "${FLATPAK_DEST}" enable.sh
    sources:
      - type: file
        path: enable.sh.in
      - type: shell
        commands:
          - sed -e "s,@FLATPAK_DEST@,${FLATPAK_DEST},g" < enable.sh.in > enable.sh

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm644 -t "${FLATPAK_DEST}/share/metainfo" org.freedesktop.Sdk.Extension.gnat15.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Sdk.Extension.gnat15.metainfo.xml
